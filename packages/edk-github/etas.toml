[package]
name = "edk-github"
version = "0.1.0"
edition = "2026"
license = "MIT OR Apache-2.0"
description = "Official EDK GitHub package skeleton"
repository = "https://github.com/etas-project/etas-edk"

[source]
root = "src"

[dependencies]
std = { version = "0.1" }
edk_http = { path = "../edk-http", import = "edk.http" }
edk_git = { path = "../edk-git", import = "edk.git" }

[[bin]]
name = "edk-github-smoke"
module = "edk.github.package_smoke"
flow = "main"
