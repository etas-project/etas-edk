[package]
name = "edk-vector"
version = "0.1.0"
edition = "2026"
license = "MIT OR Apache-2.0"
description = "Official EDK vector package skeleton"
repository = "https://github.com/etas-project/etas-edk"

[source]
root = "src"

[dependencies]
std = { version = "0.1" }
edk_http = { path = "../edk-http", import = "edk.http" }

[[bin]]
name = "edk-vector-smoke"
module = "edk.vector.package_smoke"
flow = "main"
